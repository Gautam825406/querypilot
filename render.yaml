services:
  - type: web
    name: querypilot-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Optional: set in the Render dashboard to switch the target database
      # to Postgres and the cache/broker to Redis. Unset = DuckDB demo +
      # in-memory cache, which is how the live deploy runs today.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QP_JWT_SECRET
        sync: false
